appId: ${APP_ID}
name: Delete account
---
- launchApp:
    clearState: true
# The field label (Text) and the input share this string; index 1 is the input.
- tapOn:
    text: "Email"
    index: 1
- inputText: "demo@echoes.app"
- tapOn:
    text: "Password"
    index: 1
- inputText: "echoes-demo"
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Cubbon Park"
    timeout: 20000
- tapOn: "Profile"
- scrollUntilVisible:
    element:
      text: "Delete account"
- tapOn: "Delete account"
- tapOn: "Confirm your password"
- inputText: "echoes-demo"
- hideKeyboard
- tapOn: "Delete permanently"
- assertVisible: "Sign in"
