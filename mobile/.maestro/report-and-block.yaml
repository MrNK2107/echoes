appId: ${APP_ID}
name: Report and block
---
- launchApp:
    clearState: true
# The field label (Text) and the input share this string; index 1 is the input.
- tapOn:
    text: "Email"
    index: 1
- inputText: "demo@echoes.app"
- tapOn:
    text: "Password"
    index: 1
- inputText: "echoes-demo"
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Cubbon Park"
    timeout: 20000
- tapOn: "Cubbon Park"
- tapOn: "I love this park.*"
- tapOn: "Report memory"
- assertVisible: "Why are you reporting this.*"
- tapOn: "Spam"
- tapOn: "Send report"
- assertVisible: "Thanks.*review it."
- assertNotVisible: "Send report"
- tapOn: "Report Asha Rao"
- tapOn: "Harassment or bullying"
- tapOn: "Send report"
- assertVisible: "Thanks.*review it."
- assertNotVisible: "Send report"
- tapOn: "Block Asha Rao"
- assertVisible: "You won't see their memories.*"
- tapOn: "Block"
- assertVisible: "This memory is no longer available."
