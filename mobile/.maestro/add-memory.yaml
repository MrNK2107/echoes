appId: ${APP_ID}
name: Add a memory
---
- launchApp:
    clearState: true
# The field label (Text) and the input share this string; index 1 is the input.
- tapOn:
    text: "Email"
    index: 1
- inputText: "demo@echoes.app"
- tapOn:
    text: "Password"
    index: 1
- inputText: "echoes-demo"
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Cubbon Park"
    timeout: 20000
- tapOn: "Add memory"
- tapOn: "Memory text"
- inputText: "Evening walk under the old trees"
- hideKeyboard
- tapOn: "Use my location"
- assertVisible: "Location captured"
- tapOn: "Save memory"
- assertNotVisible: "Save memory"
# Saving opens the place screen; go back to the map.
- tapOn: "Back"
- extendedWaitUntil:
    visible: "Add memory"
    timeout: 10000
