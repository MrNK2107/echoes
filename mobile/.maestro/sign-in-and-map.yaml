appId: ${APP_ID}
name: Sign in and see the map
---
- launchApp:
    clearState: true
# The field label (Text) and the input share this string; index 1 is the input.
- tapOn:
    text: "Email"
    index: 1
- inputText: "demo@echoes.app"
- tapOn:
    text: "Password"
    index: 1
- inputText: "echoes-demo"
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Cubbon Park"
    timeout: 20000
# Memory mode pins location to the demo centre; this keeps real-backend runs consistent
# (Cubbon Park, the first seeded place).
- setLocation:
    latitude: 12.9763
    longitude: 77.5929
- assertVisible: "Communities"
- assertVisible: "Profile"
- assertVisible: "Explore in AR"
- assertVisible: "Add memory"
