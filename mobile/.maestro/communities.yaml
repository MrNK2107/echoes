appId: ${APP_ID}
name: Communities
---
- launchApp:
    clearState: true
# The field label (Text) and the input share this string; index 1 is the input.
- tapOn:
    text: "Email"
    index: 1
- inputText: "demo@echoes.app"
- tapOn:
    text: "Password"
    index: 1
- inputText: "echoes-demo"
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Cubbon Park"
    timeout: 20000
- tapOn: "Communities"
# The row's accessibility label is "<name>, <type>, <members>".
- assertVisible: "Cubbon Park Walkers.*"
- tapOn: "Discover"
- assertVisible: "Cubbon Park Walkers.*"
- tapOn: "Mine"
- assertVisible: "Cubbon Park Walkers.*"
- tapOn: "Create community"
# In the sheet, the label (Text) comes first and the input second.
- tapOn:
    text: "Name"
    index: 1
- inputText: "Evening Walkers"
- tapOn:
    text: "Description"
    index: 1
- inputText: "A short walk after work."
- hideKeyboard
- tapOn: "Create"
- assertVisible: "Invite"
